<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      color: #1f2328;
      background: #f6f7f9;
    }

    header,
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
    }

    header h1 {
      margin: 24px 0 8px;
      font-size: 1.75rem;
    }

    section {
      background: #fff;
      border: 1px solid #d8dde3;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.2rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #b9c0c8;
      border-radius: 6px;
      background: #fff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field {
      margin-bottom: 12px;
    }

    .hint {
      font-weight: normal;
      color: #59636e;
      font-size: 0.9rem;
    }

    button {
      padding: 8px 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.danger {
      background: #fff;
      color: #b42318;
      border-color: #e4a7a1;
    }

    #message {
      margin-bottom: 20px;
      padding: 10px 12px;
      border-radius: 6px;
    }

    #message:empty {
      display: none;
    }

    #message.error {
      background: #fdecea;
      color: #8a1c12;
      border: 1px solid #f1b5ae;
    }

    #message.success {
      background: #e8f5ec;
      color: #1c5b30;
      border: 1px solid #a9d9b7;
    }

    .list-header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .list-header h2 {
      margin: 0;
    }

    .list-header .field {
      margin: 0;
      min-width: 180px;
    }

    #posts {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #posts>li {
      border-top: 1px solid #e4e7eb;
      padding: 14px 0;
    }

    #posts>li:first-child {
      border-top: 0;
    }

    .post-title {
      margin: 0;
      font-size: 1.1rem;
      overflow-wrap: anywhere;
    }

    .post-meta {
      margin: 2px 0 8px;
      color: #59636e;
      font-size: 0.9rem;
    }

    .post-content {
      margin: 0 0 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .tags {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 10px;
      padding: 0;
    }

    .tags li {
      background: #eef2ff;
      color: #3730a3;
      border-radius: 999px;
      padding: 1px 10px;
      font-size: 0.85rem;
    }

    .empty {
      color: #59636e;
      text-align: center;
      padding: 24px 0;
      margin: 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>Blog</h1>
  </header>

  <main>
    <div id="message" role="status" aria-live="polite"></div>

    <section aria-labelledby="new-post-heading">
      <h2 id="new-post-heading">New post</h2>
      <form id="post-form">
        <div class="field">
          <label for="author">Author</label>
          <select id="author" name="author" required>
            <option value="">Select an author</option>
          </select>
        </div>
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" required>
        </div>
        <div class="field">
          <label for="content">Content</label>
          <textarea id="content" name="content" required></textarea>
        </div>
        <div class="field">
          <label for="tags">Tags <span class="hint">(comma-separated)</span></label>
          <input id="tags" name="tags" type="text" placeholder="e.g. Programming, Food">
        </div>
        <button type="submit" id="submit-button">Create post</button>
      </form>
    </section>

    <section aria-labelledby="posts-heading">
      <div class="list-header">
        <h2 id="posts-heading">Posts</h2>
        <div class="field">
          <label for="tag-filter">Filter by tag</label>
          <select id="tag-filter">
            <option value="">All tags</option>
          </select>
        </div>
      </div>
      <ul id="posts"></ul>
    </section>
  </main>

  <script>
    const messageEl = document.getElementById('message');
    const form = document.getElementById('post-form');
    const authorSelect = document.getElementById('author');
    const titleInput = document.getElementById('title');
    const contentInput = document.getElementById('content');
    const tagsInput = document.getElementById('tags');
    const submitButton = document.getElementById('submit-button');
    const tagFilter = document.getElementById('tag-filter');
    const postsList = document.getElementById('posts');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = type;
    }

    function clearMessage() {
      messageEl.textContent = '';
      messageEl.className = '';
    }

    async function request(url, options) {
      let res;
      try {
        res = await fetch(url, options);
      } catch {
        throw new Error('Could not reach the server.');
      }
      if (!res.ok) {
        let message = `Request failed (${res.status})`;
        try {
          const body = await res.json();
          if (body && body.error) message = body.error;
        } catch {
          // Ignore JSON parse errors
        }
        throw new Error(message);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    function fillSelect(select, firstLabel, items, getValue, getLabel) {
      select.replaceChildren(new Option(firstLabel, ''));
      for (const item of items) {
        select.append(new Option(getLabel(item), getValue(item)));
      }
    }

    async function loadUsers() {
      try {
        const users = await request('/api/users');
        fillSelect(authorSelect, 'Select an author', users, u => String(u.id), u => u.name);
      } catch (err) {
        showMessage(`Could not load authors: ${err.message}`, 'error');
      }
    }

    async function loadTags() {
      const selected = tagFilter.value;
      try {
        const tags = await request('/api/tags');
        fillSelect(tagFilter, 'All tags', tags, t => t.name, t => t.name);
        tagFilter.value = tags.some(t => t.name === selected) ? selected : '';
      } catch (err) {
        showMessage(`Could not load tags: ${err.message}`, 'error');
      }
    }

    function renderPost(post) {
      const li = document.createElement('li');

      const title = document.createElement('h3');
      title.className = 'post-title';
      title.textContent = post.title;

      const meta = document.createElement('p');
      meta.className = 'post-meta';
      const date = new Date(post.created_at).toLocaleString();
      meta.textContent = `by ${post.author} · ${date}`;

      const content = document.createElement('p');
      content.className = 'post-content';
      content.textContent = post.content;

      li.append(title, meta, content);

      if (post.tags.length > 0) {
        const tagList = document.createElement('ul');
        tagList.className = 'tags';
        tagList.setAttribute('aria-label', 'Tags');
        for (const tag of post.tags) {
          const tagItem = document.createElement('li');
          tagItem.textContent = tag;
          tagList.append(tagItem);
        }
        li.append(tagList);
      }

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'danger';
      deleteButton.textContent = 'Delete';
      deleteButton.addEventListener('click', () => deletePost(post, deleteButton));
      li.append(deleteButton);

      return li;
    }

    async function loadPosts() {
      const tag = tagFilter.value;
      const url = tag ? `/api/posts?tag=${encodeURIComponent(tag)}` : '/api/posts';
      try {
        const posts = await request(url);
        if (posts.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = tag ? `No posts tagged "${tag}".` : 'No posts yet. Create the first one above.';
          postsList.replaceChildren(empty);
        } else {
          postsList.replaceChildren(...posts.map(renderPost));
        }
      } catch (err) {
        showMessage(`Could not load posts: ${err.message}`, 'error');
      }
    }

    async function refresh() {
      await loadTags();
      await loadPosts();
    }

    async function deletePost(post, button) {
      if (!confirm(`Delete "${post.title}"?`)) return;
      button.disabled = true;
      clearMessage();
      try {
        await request(`/api/posts/${post.id}`, { method: 'DELETE' });
        showMessage('Post deleted.', 'success');
        await refresh();
      } catch (err) {
        showMessage(err.message, 'error');
        button.disabled = false;
      }
    }

    function parseTags(text) {
      return text.split(',').map(t => t.trim()).filter(t => t !== '');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessage();
      submitButton.disabled = true;
      try {
        await request('/api/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: Number(authorSelect.value),
            title: titleInput.value,
            content: contentInput.value,
            tags: parseTags(tagsInput.value),
          }),
        });
        form.reset();
        showMessage('Post created.', 'success');
        await refresh();
      } catch (err) {
        showMessage(err.message, 'error');
      } finally {
        submitButton.disabled = false;
      }
    });

    tagFilter.addEventListener('change', () => {
      clearMessage();
      loadPosts();
    });

    loadUsers();
    refresh();
  </script>
</body>

</html>
